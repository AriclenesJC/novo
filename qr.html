<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d1223">
    <title>QR Code</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="top-nav">
        <a class="brand-link" href="index.html">Restaurante QR</a>
    </nav>
    <header class="hero small-hero">
        <div class="hero-content">
            <span class="eyebrow">Gerador de QR</span>
            <h1>Escaneie e abra o menu digital</h1>
            <p>Use o QR Code abaixo para aceder ao menu da mesa selecionada.</p>
        </div>
    </header>

    <main class="page-grid">
        <section class="card qr-card">
            <form id="qr-form" class="form-card">
                <label for="table-number-qr">Número da mesa</label>
                <input type="number" id="table-number-qr" name="table" min="1" max="50" value="1" required>
                <button type="submit" class="button button-primary">Gerar QR</button>
            </form>

            <div class="qr-display">
                <img id="qr-img" alt="QR code preview" style="max-width:260px;border-radius:8px;" />
                <p>Link gerado: <a id="qr-link" href="#" target="_blank"></a></p>
            </div>
        </section>

        <section class="card">
            <h2>Instruções</h2>
            <ul>
                <li>Escolha a mesa.</li>
                <li>Faça scan com a câmara do telemóvel.</li>
                <li>O menu abre automaticamente.</li>
            </ul>
            <a class="button button-secondary" href="menu.html">Ver menu</a>
        </section>
    </main>

    <script src="app.js" defer></script>
</body>
</html>
